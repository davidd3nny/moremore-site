# Сборка и публикация сайта на GitHub Pages.
# Запускается сам: после каждой правки в ветке main, каждый день в 00:05 по Баку
# (чтобы прошедшие события ушли с сайта, а новые появились в свой день) и вручную кнопкой Run workflow.
name: Сайт

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 20 * * *"   # 20:05 UTC = 00:05 в Баку
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pillow для картинок афиши
        run: pip install -r requirements.txt
      - name: Собрать сайт
        run: python build.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
