# Афиша More&More: баннер, который всплывает при входе на сайт, и блок «Афиша» на странице.
#
# Как добавить событие (можно прямо с телефона на github.com):
#   1. Загрузите картинку в папку afisha/ (кнопка Add file → Upload files). Подойдёт пост или сторис
#      из Instagram, JPG или PNG. Сайт сам уменьшит её до нужного размера.
#   2. Скопируйте блок [[event]] ниже, поменяйте поля и нажмите «Commit changes».
#   3. Через 1–2 минуты баннер на сайте. После даты «to» он исчезнет сам, удалять ничего не нужно.
#
# Поля:
#   id      короткое имя латиницей, без пробелов: karaoke-17-okt. Новый id = баннер снова покажется всем.
#   from    первый день показа, ГГГГ-ММ-ДД (по времени Баку)
#   to      последний день показа включительно
#   image   имя файла картинки из папки afisha/
#   title   название события: AZ | RU | EN (если текст на одном языке, можно одну строку без « | »)
#   when    когда: AZ | RU | EN
#   text    пара предложений: AZ | RU | EN (можно оставить пустым: "")
#   button  "book" = бронь стола через WhatsApp, "call" = звонок,
#           ссылка "https://..." (например, пост в Instagram), или "" (без кнопки)
#   popup   true = всплывает при входе на сайт; false = только в блоке «Афиша»
#
# Если событий несколько, при входе всплывает первое по списку, остальные видны в блоке «Афиша».

# Как часто всплывает баннер:
#   "always" — при каждом открытии сайта (так попросил клиент);
#   "daily"  — раз в день у каждого гостя: закрыл, и до завтра баннер его не беспокоит.
popup_repeat = "always"

[[event]]
id = "primer"
from = "2026-10-08"
to = "2026-12-31"
image = "primer.jpg"
title = "Nümunə: karaoke gecəsi | Пример: караоке-вечер | Sample: karaoke night"
when = "Cümə · 21:00 | Пятница · 21:00 | Friday · 21:00"
text = "Belə görünəcək: tədbirləriniz qonaqları sayta girən kimi qarşılayır. | Так это будет выглядеть: ваши события встречают гостя сразу при входе на сайт. | This is how it will look: your events greet guests the moment they open the site."
button = "book"
popup = true
